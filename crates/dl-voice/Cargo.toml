[package]
name = "dl-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Microphone capture, wake word, transcription and speech for Atlas."

[dependencies]
dl-atlas = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Porcupine is loaded at runtime rather than linked, so the wake word costs no
# build-time dependency and no committed binary. See src/wake.rs.
libloading = "0.8"
# Blocking HTTP with rustls: the two assets voice needs are fetched on
# request, and a pure-Rust TLS stack keeps the cross-compile trivial.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }

[dev-dependencies]
tempfile = "3"

# The engines are Windows-only, exactly as the Win32 platform layer is: speech
# synthesis has no equivalent here, and gating them keeps `audio` — which
# carries the conversion rules worth testing — building and running on Linux
# CI. macOS gets its own arm in phase 10.

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
whisper-rs = "0.14"
windows = { version = "0.62", features = [
    "Media_SpeechSynthesis",
    "Media_Playback",
    "Media_Core",
    "Foundation",
    "Storage_Streams",
] }
