name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The pure crates carry the slot engine and every domain rule, so they are
  # worth checking on the fast runner before spending a Windows one.
  core:
    name: Core crates and UI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # cargo check does not link, so the *entire* workspace — Tauri app
      # included — type-checks here even though it cannot run. mingw supplies
      # the resource compiler tauri-build needs; without it apps/desktop is
      # invisible until a Windows runner picks it up, which is exactly how a
      # broken import reached CI once already.
      # g++ as well as gcc: whisper-rs builds whisper.cpp, which is C++, and
      # without it the voice crate is the one part of the workspace this job
      # cannot see — exactly the gap that let a broken apps/desktop import
      # through once already.
      - name: Windows build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Type-check the whole workspace for Windows
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo clippy --target x86_64-pc-windows-gnu --workspace --all-targets -- -D warnings

      - name: Generated TypeScript is up to date
        run: |
          cargo test -p dl-core -p dl-engine -p dl-metrics -p dl-archive -p dl-atlas export_bindings
          git diff --exit-code -- apps/ui/shared/src/generated \
            || (echo "::error::Generated bindings are stale. Run 'npm run gen:types' and commit." && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # Upstream's own UI suite, run against the vendored copy. The archive
      # menu patches five of mino's files and this covers all five, so it is
      # what says the patch left the workbench working — and what will say so
      # again after the next resync. Developer Layer's archive tests are in it.
      - run: npm run test:ui

      - run: npm run build

      # The vendored UI's TypeScript comes from mino-core by ts-rs, exactly as
      # ours comes from dl-core, and drifts the same way after a resync.
      - name: The workbench's generated TypeScript is up to date
        env:
          TS_RS_EXPORT_DIR: ${{ github.workspace }}/vendor/mino/ui/src/Types
        run: |
          cargo test -p mino-core export_bindings
          git diff --exit-code -- vendor/mino/ui/src/Types/generated \
            || (echo "::error::The workbench's bindings are stale after a mino-core change." && exit 1)

  # Only Windows can compile the platform crate and Tauri, so this job is the
  # first real check on anything touching Win32.
  windows:
    name: Full workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # tauri-build validates frontendDist, so the frontend must exist first.
      - run: npm run build

      - name: Clippy (including dl-platform-win)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `--exclude mino-core` is about ownership, not confidence. Its suite is
      # upstream's, runs against real git repositories in temp directories and
      # is already run by mino-workbench's own CI; re-running it on every push
      # here buys minutes and flake surface, not signal. The vendored copy is
      # still type-checked and clippy-linted by the step above and by the
      # Linux job's windows-gnu pass, which is what catches a bad resync.
      # To run it deliberately: `cargo test -p mino-core`.
      - name: Tests
        run: cargo test --workspace --exclude mino-core
