[workspace]
resolver = "2"
members = [
    "crates/dl-core",
    "crates/dl-platform",
    "crates/dl-platform-win",
    "crates/dl-platform-mac",
    "crates/dl-wm",
    "crates/dl-engine",
    "crates/dl-config",
    "crates/dl-metrics",
    "crates/dl-apps",
    "crates/dl-atlas",
    "apps/desktop",
    "crates/dl-archive",
    "crates/dl-voice",
    # Vendored from mino-workbench. In `members` so the workspace type-checks it
    # and the desktop app links it; deliberately *not* in `default-members`,
    # because upstream owns its test suite and a bare `cargo test` here should
    # run Developer Layer's own.
    "vendor/mino/crates/mino-core",
]

# `apps/desktop` pulls in Tauri, which needs webkit2gtk on Linux. Excluding it
# from the default set means a bare `cargo test` runs the pure crates anywhere,
# while CI on windows-latest uses `--workspace` to build the real thing.
default-members = [
    "crates/dl-core",
    "crates/dl-platform",
    "crates/dl-platform-win",
    "crates/dl-platform-mac",
    "crates/dl-wm",
    "crates/dl-engine",
    "crates/dl-config",
    "crates/dl-metrics",
    "crates/dl-apps",
    "crates/dl-atlas",
    "crates/dl-archive",
    "crates/dl-voice",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
# 1.85 is the floor edition 2024 imposes. `mino-core` pulls russh, whose
# transitive zeroize is published as edition 2024 and will not parse below it.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/MinaLouisLeon/developer-layer"

[workspace.dependencies]
dl-core = { path = "crates/dl-core" }
dl-platform = { path = "crates/dl-platform" }
dl-platform-win = { path = "crates/dl-platform-win" }
dl-platform-mac = { path = "crates/dl-platform-mac" }
dl-wm = { path = "crates/dl-wm" }
dl-engine = { path = "crates/dl-engine" }
dl-config = { path = "crates/dl-config" }
dl-metrics = { path = "crates/dl-metrics" }
dl-apps = { path = "crates/dl-apps" }
dl-atlas = { path = "crates/dl-atlas" }
dl-archive = { path = "crates/dl-archive" }
dl-voice = { path = "crates/dl-voice" }

# Vendored. `vendor/mino/crates/mino-core/Cargo.toml` is byte-identical to
# upstream, which means it inherits every dependency below from this table by
# `.workspace = true`. Keeping it unmodified is what makes a resync a copy
# rather than a merge — see vendor/mino/VENDOR.md.
mino-core = { path = "vendor/mino/crates/mino-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }

# mino-core's dependency set, versions as upstream pins them. See the note on
# `mino-core` above for why these live here rather than in its own manifest.
anyhow = "1.0.95"
async-trait = "0.1.83"
base64 = "0.22.1"
clap = { version = "4.5.23", features = ["derive"] }
futures-util = "0.3.31"
portable-pty = "0.8.1"
tokio = { version = "1.42.0", features = ["full"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
which = "7.0.1"
russh = "0.49.0"
russh-sftp = "2.0.5"
tokio-tungstenite = "0.24.0"
axum = { version = "0.8.1", features = ["ws"] }

# NOTE: panic = "abort" is deliberately NOT set. The shell hides the native
# taskbar, so the panic hook must be able to run and restore it before exit.
# Reliability beats the binary-size win here.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Symbols are kept on purpose while this is a beta. Stripping saves perhaps
# fifteen megabytes in the installer and costs every panic report its
# backtrace — and panics matter more here than in most applications, because
# the panic hook is one of the four routes that put the user's taskbar back.
# A build whose purpose is finding faults should be able to describe them.
strip = false
debug = "line-tables-only"
